# === Applikation ===
quarkus.application.name=queue-system-v2

# === HTTP ===
# 0 = tilfældig port; 8081 kolliderer med main-platformens lokale Tomcat.
quarkus.http.test-port=0

# === Persistens (MySQL) ===
# Dev/test: Dev Services. Prod: miljøvariabler.
quarkus.datasource.db-kind=mysql

# Fast port/credentials, så et DB-værktøj kan gemme forbindelsen. Kun %dev —
# tests skal kunne køre side om side med dev-mode. 3306 er main-platformens MySQL.
%dev.quarkus.datasource.devservices.port=3307
%dev.quarkus.datasource.devservices.db-name=queuesystem
%dev.quarkus.datasource.devservices.username=quarkus
%dev.quarkus.datasource.devservices.password=quarkus

%prod.quarkus.datasource.jdbc.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:queuesystem}
%prod.quarkus.datasource.username=${DB_USERNAME:queuesystem}
%prod.quarkus.datasource.password=${DB_PASSWORD}
# Driverens OTel kalder GlobalOpenTelemetry.get() før Quarkus' SDK findes,
# og prod-opstarten vælter på IllegalStateException. Quarkus ejer den globale.
quarkus.datasource.jdbc.additional-jdbc-properties.openTelemetry=DISABLED

# Flyway i alle miljøer; Hibernate validerer kun — entity-ændringer kræver en migration.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# === Domæne-events (RabbitMQ) ===
# Dev/test: Dev Services.
%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USERNAME}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD}
# Kontrakt: PLATFORM_EVENTS.md. Fejlede beskeder afvises til DLQ'en.
mp.messaging.incoming.platform-events.connector=smallrye-rabbitmq
mp.messaging.incoming.platform-events.exchange.name=platform.events
mp.messaging.incoming.platform-events.exchange.type=topic
mp.messaging.incoming.platform-events.queue.name=queue-system-v2.platform-events
mp.messaging.incoming.platform-events.routing-keys=organizer.*,event.*,membersystem.*
mp.messaging.incoming.platform-events.auto-bind-dlq=true
# Uden dlx.declare fejler opsætningen i en reconnect-løkke, der lækker forbindelser.
mp.messaging.incoming.platform-events.dlx.declare=true
mp.messaging.incoming.platform-events.failure-strategy=reject
# Ellers leverer "application/json; charset=utf-8" en rå Buffer, og alt ryger i DLQ.
mp.messaging.incoming.platform-events.content-type-override=application/json

# === Frontend (Quinoa + Svelte 5, kun intern brug) ===
# Quinoa henter selv Node.
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.19.0
quarkus.quinoa.build-dir=dist
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.ignored-path-prefixes=/api,/q
%test.quarkus.quinoa.enabled=false

# === Fejllog (Logs-fanen) ===
# ErrorLogBuffer → error_log hvert 5. s (ErrorLogFlusher), som også håndhæver retention.
queue.error-log.retention-days=30
# Scheduleren er slukket i tests — jobs kaldes eksplicit.
%test.quarkus.scheduler.enabled=false

# !!! MIDLERTIDIGT — SKAL AFGØRES FØR PROD !!!
# Build-tid-flag i stedet for @IfBuildProfile("dev"), så belastningsriggen kan køre
# simulatoren i containere. Et prod-image med simulatoren er dermed ét flag væk:
# enten beviser pipelinen, at flaget er false, eller også rulles det tilbage.
# Se også den midlertidige surefire-blok i pom.xml (Docker Desktop), som fejler i CI.
queue.dev-tools.enabled=false
%dev.queue.dev-tools.enabled=true

# Lås-række id 1.
queue.activation.interval=1s
queue.activation.page-size=500
queue.activation.max-admissions=500
queue.activation.max-queue-transitions=2000

# === Expiry (sikkerhedsnettet) ===
# Platformens close er kun best-effort. Lås-række id 2.
queue.expiry.interval=30s
queue.expiry.open-ttl=30m
# Ingen tilstedeværelseskrav mens man venter — browsere fryser baggrundsfaner.
queue.expiry.waiting-timeout=4h
queue.expiry.batch-size=500

# === Dræning (nedgraderede grene) ===
# Arkiverer nedgraderede grene, når de er tomme. Lås-række id 5.
queue.draining.interval=5m
queue.draining.batch-size=100

# === Retention (natjobbet) ===
# 02:00 dansk tid: sletter arkiverede køer og CLOSED-sessioner forbi perioden.
# Lås-række id 3. Langtidshistorik kræver rollups (ikke bygget).
queue.retention.cron=0 0 2 * * ?
queue.retention.months=12
queue.retention.batch-size=5000
queue.metrics.snapshot-interval=30s

# === Lodtrækning (pre-queue) ===
# Blander pre-queuen ved salgsstart; motoren venter på drawn_at. Lås-række id 4.
queue.draw.interval=5s
queue.draw.batch-size=500
# Lille batch, så samtidighedstesten skifter låsen mange gange.
%test.queue.draw.batch-size=25

# === Container image & Kubernetes ===
quarkus.container-image.group=eventit
# quarkus.container-image.registry=<registry-host>   # udfyldes når registry er valgt
quarkus.kubernetes.replicas=1
quarkus.kubernetes.env.mapping.new-relic-license-key.from-secret=new-relic
quarkus.kubernetes.env.mapping.new-relic-license-key.with-key=license-key

# === Observability ===
quarkus.otel.traces.enabled=false
quarkus.otel.logs.enabled=false
%prod.quarkus.otel.metrics.enabled=true
%prod.quarkus.otel.exporter.otlp.metrics.endpoint=${NEW_RELIC_OTLP_ENDPOINT:https://otlp.eu01.nr-data.net}
%prod.quarkus.otel.exporter.otlp.metrics.protocol=http/protobuf
%prod.quarkus.otel.exporter.otlp.metrics.headers=api-key=${NEW_RELIC_LICENSE_KEY}
%prod.quarkus.otel.exporter.otlp.metrics.compression=gzip
%prod.quarkus.otel.exporter.otlp.metrics.temporality-preference=delta
%prod.quarkus.otel.exporter.otlp.metrics.default-histogram-aggregation=base2_exponential_bucket_histogram
